# ============================================================================
# PIPELINE CONFIGURATION
# ============================================================================
pipeline:
  enable_cache: false
  cache_ttl_hours: 24
  cache_key_includes_version: true
  cache_invalidation_on_config_change: true

  cache_steps:
    advanced_data_ingestion: true
    validate_samples: true
    augment_malicious_samples: true
    train_model: false  # Always train fresh to avoid state pollution

# ============================================================================
# API KEYS & NETWORK CONFIGURATION
# ============================================================================
api_keys:
  github_token: ${GITHUB_API_TOKEN}
  vx_github_token: ${VXUNDERGROUND_GITHUB_TOKEN}
  thezoo_github_token: ${THEZOO_GITHUB_TOKEN}
  nvd_api_key: ${NVD_API_KEY}
  malwarebazaar_api_key: ${MALWAREBAZAAR_API_KEY}
  huggingface_token: ${HUGGINGFACE_TOKEN}
  scriptguard_api_key: ${SCRIPTGUARD_API_KEY}

  max_retries: 3
  retry_backoff_factor: 2
  timeout_seconds: 30
  connection_pool_size: 10

# ============================================================================
# DATA SOURCES CONFIGURATION - OPTIMIZED FOR PYTHON MALWARE DETECTION
# ============================================================================
data_sources:
  github:
    enabled: true
    fetch_malicious: true
    fetch_benign: true
    timeout: 30
    max_retries: 3
    retry_backoff_factor: 2.0

    malicious_keywords:
      # Classic Threats
      - "reverse-shell python"
      - "keylogger python"
      - "ransomware python"
      - "backdoor python"
      - "credential stealer python"
      - "port scanner python"
      # Modern Threats (Stealers/RATs)
      - "discord token stealer python"
      - "telegram rat python"
      - "browser password stealer python"
      - "cookie grabber python"
      - "wifi password stealer python"
      # Techniques
      - "process injection python"
      - "obfuscated payload python"
      - "uac bypass python"
      - "exploit python"
      - "payload python"

    benign_repos:
      # Administrative & DevOps (Critical for reducing False Positives)
      - "ansible/ansible"
      - "saltstack/salt"
      - "fabric/fabric"
      - "paramiko/paramiko"           # SSH usage (critical context)
      - "giampaolo/psutil"            # Process management (critical context)
      - "pyinstaller/pyinstaller"
      - "pallets/click"
      - "celery/celery"

      # Core Frameworks & Web
      - "django/django"
      - "pallets/flask"
      - "tiangolo/fastapi"
      - "encode/httpx"                # HTTP client
      - "psf/requests"
      - "aio-libs/aiohttp"
      - "tornadoweb/tornado"

      # Security & Crypto (Proper legal patterns)
      - "pyca/cryptography"
      - "certbot/certbot"             # Security tool
      - "sqlmapproject/sqlmap"        # Offensive but legitimate tool (Hard Negative)
      - "nmap/nmap"

      # Data Processing & Cloud
      - "scikit-learn/scikit-learn"
      - "pandas-dev/pandas"
      - "numpy/numpy"
      - "pytorch/pytorch"
      - "boto/boto3"
      - "docker/docker-py"
      - "kubernetes-client/python"

      # Web Scraping & Automation
      - "scrapy/scrapy"
      - "SeleniumHQ/selenium"

    max_samples_per_keyword: 1000
    max_files_per_repo: 800

  malwarebazaar:
    enabled: true
    timeout: 60
    max_retries: 3
    retry_backoff_factor: 2.0
    # Added modern tags
    tags: ["python", "script", "ransomware", "backdoor", "stealer", "rat", "trojan"]
    max_samples: 2000

  vxunderground:
    enabled: true
    timeout: 60
    max_retries: 3
    retry_backoff_factor: 2.0
    # STRICT: Only .py files to match validation logic
    script_types: [".py"]
    max_samples: 2000

  thezoo:
    enabled: true
    timeout: 60
    max_retries: 3
    retry_backoff_factor: 2.0
    # STRICT: Only .py files
    script_types: [".py"]
    max_samples: 1000

  huggingface:
    enabled: true
    timeout: 180
    max_retries: 3
    retry_backoff_factor: 2.0
    # High-quality datasets for correct Python logic (Benign)
    datasets:
      - "flytech/python-codes-25k"          # Algorithmic/Educational
      - "mbpp"                              # Mostly Basic Python Problems (Google)
      - "iamtarun/python_code_instructions_18k_alpaca" # Instruction tuning
    # Limited to prevent class imbalance (approx 1:1 or 1:2 with malware)
    max_samples: 4000

  # Disable CVE feeds for training (too much text noise, good only for RAG)
  cve_feeds:
    enabled: false
    timeout: 45
    max_retries: 3
    retry_backoff_factor: 2.0
    days_back: 119
    keywords: ["script", "code execution", "command injection", "python", "malicious"]

  additional_hf:
    enabled: true
    timeout: 120
    max_retries: 3
    retry_backoff_factor: 2.0
    max_samples_per_dataset: 400

    malware_datasets:
      - naorm/malware-text-db
      - iosifache/Malware-Detection
      # Removed PowerShell dataset to maintain strict Python validation
      - pacificsun/Malware_10k
      - cw1521/ember2018-malware-v2
      - SubhadipPanda/Malware_Detection_System

    classification_datasets:
      - deepcode-ai/Malware-Prediction
      - PurCL/malware-top-100-labels

  pypi:
    enabled: true
    timeout: 30
    max_retries: 3
    retry_backoff_factor: 2.0
    top_packages: 500          # Reduced to avoid flooding with generic code
    max_files_per_package: 20
    max_samples: 2000

# ============================================================================
# DATABASE & VECTOR STORE CONFIGURATION
# ============================================================================
database:
  type: "postgresql"
  postgresql:
    host: ${POSTGRES_HOST:-localhost}
    port: ${POSTGRES_PORT:-5432}
    database: ${POSTGRES_DB:-scriptguard}
    user: ${POSTGRES_USER:-scriptguard}
    password: ${POSTGRES_PASSWORD:-scriptguard}

# ============================================================================
# CODEBERT CLASSIFIER CONFIGURATION
# ============================================================================
codebert:
  model_name: "microsoft/graphcodebert-base"
  max_tokens: 512
  chunk_overlap: 50
  batch_size: 16
  learning_rate: 2.0e-5
  warmup_steps: 200
  lr_scheduler_type: "cosine"
  weight_decay: 0.1
  num_epochs: 3
  eval_threshold: 0.92
  focal_gamma: 2.0  # Focal Loss gamma: 0=CrossEntropy, 2=standard focal, higher=harder examples focus
  max_grad_norm: 1.0  # Gradient clipping threshold (lower = more aggressive clipping)
  decision_threshold: 0.50  # Malicious class probability threshold (lower = more aggressive detection)
  output_dir: ${MODEL_OUTPUT_DIR:-/workspace/models/codebert}
  report_to: "none"
  # Training loop
  logging_steps: 50
  save_total_limit: 2
  metric_for_best_model: "eval_mcc"
  # Fusion model architecture (Gated Fusion v2.0)
  num_labels: 2
  mlp_hidden_dim: 128
  fusion_hidden_dim: 256
  dropout_rate: 0.2       # projection branch dropout (feat_proj)
  cls_head_dropout: 0.3   # classification head dropout
  backbone_freeze_epochs: 1  # freeze BERT for epoch 0, unfreeze from epoch 1

# ============================================================================
# DATA VALIDATION & AUGMENTATION
# ============================================================================
validation:
  validate_syntax: true
  skip_syntax_errors: true
  min_length: 50
  max_length: 100000

  # Deduplication settings
  deduplicate: true
  dedup_threshold: 0.92  # Increased from 0.85 for less aggressive deduplication

  # Deduplication method selection
  dedup_method: "auto"          # Options: "auto", "minhash_lsh", "jaccard", "exact"
                                # auto = MinHash LSH if n >= 1000, else Jaccard

  # Two-stage deduplication config
  dedup_exact_first: true       # Fast hash-based pre-filter (removes ~90% duplicates)

  # MinHash LSH settings (only used if method = "minhash_lsh" or "auto")
  dedup_minhash_num_perm: 128   # Higher = more accurate (128, 256, 512)
                                # 128 = 95% accuracy, 256 = 98%, 512 = 99%

  # Jaccard fallback settings (only used if method = "jaccard")
  dedup_batch_size: 1000        # Batch size for fuzzy matching (controls memory)
  dedup_max_memory_mb: 500      # Memory limit before GC trigger

  filter_test_leakage: true
  allow_python2: true     # Accept Python 2 syntax for historical malware

augmentation:
  enabled: true
  variants_per_sample: 3  # Increased from 2 for more malware variants
  techniques: ["base64", "hex", "rename_vars", "split_strings"]

  balance_dataset: false  # DISABLED: Using weighted loss + augmentation to preserve all data
  target_balance_ratio: 1.0
  balance_method: "hybrid"  # Improved over simple oversampling
  augment_after_split: true # Crucial: prevents data leakage into test set

# ============================================================================
# TRAINING SPLIT CONFIGURATION
# ============================================================================
training:
  test_size: 0.2
  val_size: 0.2
  seed: 42
  early_stopping_patience: 2

logging:
  level: ${LOG_LEVEL:-INFO}
  file: ${LOG_FILE:-/workspace/logs/scriptguard.log}

runpod:
  pod_id: ${RUNPOD_POD_ID:-}
  volume_mount: ${RUNPOD_VOLUME_PATH:-/workspace}
  test_network_on_startup: true