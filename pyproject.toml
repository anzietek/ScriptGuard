[project]
name = "scriptguard"
version = "0.1.0"
description = "ML-based Malicious Script Detection Pipeline"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    # --- Core ML (CUDA 12.4) ---
    "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
    "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
    "torchvision @ https://download.pytorch.org/whl/cu124/torchvision-0.20.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
    "torchvision @ https://download.pytorch.org/whl/cu124/torchvision-0.20.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
    "torchaudio @ https://download.pytorch.org/whl/cu124/torchaudio-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
    "torchaudio @ https://download.pytorch.org/whl/cu124/torchaudio-2.5.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
    # --- Transformers & Training ---
    #"transformers>=4.51.3",
    "transformers==4.46.3",
    "accelerate>=0.34.0",
    "peft>=0.7.1",
    "scikit-learn>=1.4.0",
    # --- MLOps & Data ---
    "zenml[server]>=0.63.0",
    "datasets>=2.20.0",
    # --- Database ---
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    # --- Utils ---
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "requests>=2.32.0",
    "huggingface-hub>=0.24.0",
    "pydantic>=2.11.9",
    "psutil>=5.9.8",
    "datasketch>=1.9.0",
    "hf-xet>=1.2.0",
    # --- Inference API ---
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
]

[project.scripts]
scriptguard = "scriptguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/scriptguard"]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu124"
extra-index-url = ["https://pypi.org/simple"]
index-strategy = "unsafe-first-match"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.14.0",
]
